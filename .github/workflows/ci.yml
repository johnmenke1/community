name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://community:community@localhost:5432/community
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-prod-1234567890
      BETTER_AUTH_URL: http://localhost:3000
      API_PORT: 3001
      WEB_PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Verify API boots
        # Start the api, hit /api/health, kill it. Catches boot-time
        # errors (missing migrations, bad schema refs, env mismatches)
        # that pure typecheck + build would miss.
        run: |
          (cd apps/api && node dist/main.js &) && \
          for i in {1..15}; do \
            if curl -sf http://localhost:3001/api/health > /dev/null; then \
              echo "API healthy"; \
              pkill -f "node dist/main.js"; \
              exit 0; \
            fi; \
            sleep 1; \
          done; \
          echo "API failed to start within 15s"; \
          exit 1
